[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-toolkit"
version = "0.1.0"
description = "Value-at-Risk and Conditional VaR for a multi-asset portfolio via historical, parametric, and Monte Carlo methods, with a symbolic derivation and a Kupiec backtest."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Peter Malonza" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
market-data = ["yfinance>=0.2"]

[project.scripts]
portfolio-risk = "portfolio_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "network: requires internet access to Yahoo Finance (deselect with '-m \"not network\"')",
]
